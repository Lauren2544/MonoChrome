<!DOCTYPE html>
<html>
<head>
  <title>MonoChrome</title>
  <script src="../scripts/popup.js"></script>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

  <br>
  <h1>Welcome to MonoChrome</h1>
  <br>

  <p class="top-message">
    This tool turns websites greyscale because colours are beautiful, sometimes so beautiful they can keep you glued to the screen.
  </p>

  <p id="grey-message" style="display:none;">Grey scale filter is: OFF</p>
  
  <div id="apply-grey-container">
    <p>Click the button below to turn ON the filter.</p>
    <button id="apply-grey" class="grey-button">Apply Greyscale Filter</button>
  </div>

  <div id="remove-grey-container">
    <p id="intention-message">Enter your intention, to turn OFF the filter.</p>
    <div class="input-container" id="intention-input-container">
      <input type="text" id="intention-input" placeholder="Enter your intention...">
      <div id="intention-char-count" class="char-count">0 characters</div>
    </div>
    <p id="intention-feedback-message"></p>
    <button id="remove-grey" class="colour-button" style="display:none">Remove Greyscale Filter</button>
  </div>
  <br>
</body>
</html>
